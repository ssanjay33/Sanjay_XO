# ===================================================
# XO EVENT MANAGEMENT - PRODUCTION CONFIG (RENDER)
# ===================================================
# This profile is activated on Render via:
#   SPRING_PROFILES_ACTIVE=prod
#
# All values below are read from Environment Variables
# that you will set in the Render dashboard. Nothing
# sensitive is hardcoded here.
# ===================================================

# Render provides the PORT env var automatically
server.port=${PORT:8080}
server.address=0.0.0.0

# ===================================================
# DATABASE (PostgreSQL - Render managed database)
# ===================================================
# The JDBC URL is assembled from individual pieces (host/port/db)
# rather than a raw connection string, since Render's connection
# string is not in JDBC format by default.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================
# JPA / HIBERNATE
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================
# JWT (use a long random secret in the Render dashboard,
# do NOT reuse the default local dev secret in production)
# ===================================================
xo.app.jwtSecret=${JWT_SECRET}
xo.app.jwtExpirationMs=86400000

# ===================================================
# EMAIL / SMTP (for signup verification codes)
# ===================================================
xo.app.brevo.apiKey=${BREVO_API_KEY:}
xo.app.brevo.senderEmail=${BREVO_SENDER_EMAIL:}
xo.app.brevo.senderName=${BREVO_SENDER_NAME:XO Events}

# ===================================================
# LOGGING
# ===================================================
logging.level.org.springframework.security=INFO
logging.level.com.xo.eventmanagement=INFO
