# ===================================================
# XO EVENT MANAGEMENT - APPLICATION CONFIGURATION
# ===================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=xo-event-management

# ===================================================
# DATABASE CONFIGURATION (MySQL)
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/xo_event_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================
# JWT CONFIGURATION
# ===================================================
xo.app.jwtSecret=XOEventManagementSecretKeyForJWTTokenGenerationMustBeLongEnough123456789
xo.app.jwtExpirationMs=86400000

# ===================================================
# FILE UPLOAD CONFIGURATION
# ===================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
xo.app.uploadDir=uploads/event-images

# ===================================================
# EMAIL / SMTP CONFIGURATION (for signup verification codes)
# ===================================================
# Leave username/password blank during local development if you don't
# want to set up real email - verification codes will be printed to
# the console/log instead (search for "DEV MODE").
#
# To send real emails via Gmail:
#  1. Enable 2-Step Verification on your Google account
#  2. Create an "App Password" at https://myaccount.google.com/apppasswords
#  3. Put your Gmail address as username and the App Password below
xo.app.brevo.apiKey=
xo.app.brevo.senderEmail=
xo.app.brevo.senderName=XO Events

# ===================================================
# LOGGING
# ===================================================
logging.level.org.springframework.security=INFO
logging.level.com.xo.eventmanagement=DEBUG

# ===================================================
# JACKSON (JSON) CONFIGURATION
# ===================================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
