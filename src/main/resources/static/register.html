<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - XO Event Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" id="xo-navbar"></nav>

<div class="form-card">
  <h2>Create Account</h2>
  <p class="subtitle">Join XO Events today</p>

  <form id="registerForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" required placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="9876543210">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
    </div>
    <div class="form-group">
      <label>I want to register as</label>
      <select id="role">
        <option value="ATTENDEE">Attendee - browse and book events</option>
        <option value="ORGANIZER">Organizer - create and manage events</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
    <div id="msg"></div>
  </form>

  <div class="form-footer">
    Already have an account? <a href="login.html">Login here</a>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      password: document.getElementById('password').value,
      role: document.getElementById('role').value
    };
    const msg = document.getElementById('msg');
    msg.innerHTML = '';

    try {
      await apiRequest('/auth/signup', 'POST', payload, false);
      msg.innerHTML = `<p class="success-msg">Account created! Check your email for a 6-digit verification code. Redirecting...</p>`;
      setTimeout(() => window.location.href = 'verify-email.html?email=' + encodeURIComponent(payload.email), 1800);
    } catch (err) {
      msg.innerHTML = `<p class="error-msg">${err.message}</p>`;
    }
  });
</script>
</body>
</html>
