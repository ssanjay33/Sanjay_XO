<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - XO Event Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" id="xo-navbar"></nav>

<div class="form-card">
  <h2>Welcome Back</h2>
  <p class="subtitle">Login to your XO Events account</p>

  <form id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Login</button>
    <div id="msg"></div>
  </form>

  <div class="form-footer">
    Don't have an account? <a href="register.html">Sign up here</a>
  </div>
  <div class="form-footer" style="margin-top:10px; font-size:12px;">
    Admin demo login: admin@xoevents.com / Admin@123
  </div>
</div>

<script src="js/common.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.innerHTML = '';

    try {
      const data = await apiRequest('/auth/login', 'POST', { email, password }, false);
      saveAuth(data);
      if (data.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
      else if (data.role === 'ORGANIZER') window.location.href = 'organizer-dashboard.html';
      else window.location.href = 'events.html';
    } catch (err) {
      if (err.message.toLowerCase().includes('verify')) {
        msg.innerHTML = `<p class="error-msg">${err.message} <a href="verify-email.html?email=${encodeURIComponent(email)}">Verify now</a></p>`;
      } else {
        msg.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }
  });
</script>
</body>
</html>
